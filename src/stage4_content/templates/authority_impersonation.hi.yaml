technique: authority_impersonation
language: hi
title: "अधिकारी बनकर आने वाली कॉल से सावधान रहें"
technique_layer: >
  ठग अक्सर खुद को पुलिस अधिकारी, बैंक कर्मचारी, कूरियर कंपनी या सरकारी अधिकारी
  बताते हैं। वे डर या जल्दबाज़ी पैदा करते हैं ताकि आप सोचने या किसी से पूछने का
  समय न लें। यह एक सामान्य तरीका है जो कई अलग-अलग ठगी में इस्तेमाल होता है —
  इस तरीके को पहचानना ही आपकी सुरक्षा है, भले ही यह किसी नए रूप में आए।
variant_layer_template: >
  {region_generic} क्षेत्र से हाल की रिपोर्टों में इस तरीके का इस्तेमाल इससे
  जुड़ा देखा गया है: {variant_signal}। कॉल करने वाला आपकी निजी जानकारी बता कर
  भरोसा दिला सकता है — इससे उसकी बात सच नहीं हो जाती।
action_steps:
  - "फोन रखें और खुद ढूंढे गए नंबर से संस्था को वापस कॉल करें, कॉलर के दिए नंबर से नहीं।"
  - "कोई भी असली अधिकारी पैसे को 'सुरक्षित' रखने के नाम पर ट्रांसफर करने को नहीं कहेगा।"
  - "समय लें। जल्दबाज़ी एक तरीका है, कार्रवाई करने की वजह नहीं।"
