technique: refund_inversion
language: hi
title: "जो 'रिफंड' कॉल पैसे मांगे, वह रिफंड नहीं है"
technique_layer: >
  इस तरीके में कोई कहता है कि आपको रिफंड, कैशबैक या गलती से भेजा पैसा मिलना है —
  फिर कहता है कि पहले फीस देनी होगी, कोड बताना होगा या कोई रिक्वेस्ट स्वीकार
  करनी होगी। असली रिफंड के लिए कभी पहले पैसे भेजने, रिक्वेस्ट स्वीकार करने या
  OTP बताने की ज़रूरत नहीं होती।
variant_layer_template: >
  {region_generic} क्षेत्र से रिपोर्टों में यह तरीका इससे जुड़ा देखा गया है:
  {variant_signal}। रिक्वेस्ट असली सेवा के नाम के साथ आ सकती है।
action_steps:
  - "असली रिफंड के लिए पहले पैसे भेजने, रिक्वेस्ट स्वीकार करने या OTP बताने को नहीं कहा जाता।"
  - "खुद शुरू न की गई किसी भी पेमेंट रिक्वेस्ट को स्वीकार न करें।"
  - "रिफंड स्टेटस केवल आधिकारिक ऐप या वेबसाइट से जांचें, किसी भेजे गए लिंक से नहीं।"
